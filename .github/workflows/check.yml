name: Check
on:
  push:
    branches: [master]
  pull_request:
jobs:
  pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every chapter has a picture, CSP hash is current
        run: node tools/check_pictures.js
