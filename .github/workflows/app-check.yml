name: App check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  phone-test:
    name: Phone-size browser test (reading, sign-in, sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the app test
        run: node tests/app.test.js
